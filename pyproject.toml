[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a-stock-quant-system"
version = "1.0.0"
description = "A股量化交易系统 - 财报监控、股票池筛选、多因子分析"
readme = "README.md"
authors = [
    {name = "量化小助理", email = "quant-assistant@example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "akshare>=1.8.0",
    "yfinance>=0.1.70",
    "requests>=2.26.0",
    "beautifulsoup4>=4.10.0",
    "backtrader>=1.9.76.123",
    "sqlite3",
]

[project.optional-dependencies]
dev = [
    "pylint>=2.11.0",
    "black>=21.9b0",
    "mypy>=0.910",
    "pytest>=6.2.0",
    "pytest-cov>=3.0.0",
    "python-dotenv>=0.19.0",
    "loguru>=0.5.0",
    "tqdm>=4.62.0",
]
ml = [
    "scikit-learn>=1.0.0",
    "xgboost>=1.5.0",
    "lightgbm>=3.3.0",
]

[project.urls]
Homepage = "https://github.com/username/a-stock-quant-system"
Documentation = "https://github.com/username/a-stock-quant-system/docs"
Repository = "https://github.com/username/a-stock-quant-system.git"
Issues = "https://github.com/username/a-stock-quant-system/issues"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=scripts --cov=strategies --cov=skills --cov-report=term-missing"

[project.scripts]
quant-monitor = "scripts.final_financial_monitor:main"
stock-pool-filter = "strategies.stock_pool_filter_fixed:main"
daily-report = "scripts.generate_daily_report:main"